<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora 1.0</title>

  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #111827;
      --border-soft: #1f2933;
      --text-main: #e5e7eb;
      --text-muted: #9ca3af;
      --primary: #175ccc;
      --primary-hover: #244997;
      --error: #ef4444;
      --success: #22c55e;
    }

    body {
      font-family: "Inter", "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, #0f172a, #020617);
      margin: 0;
      padding: 24px;
      color: var(--text-main);
      line-height: 1.6;
    }

    h1 {
      text-align: center;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 32px;
    }

    .container {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .box {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      padding: 24px;
      width: 420px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
    }

    input {
      width: 93%;
      padding: 12px 14px;
      margin-top: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-soft);
      font-size: 16px;
      background: #020617;
      color: var(--text-main);
      outline: none;

      /* Remove setas no Firefox */
      -moz-appearance: textfield;
      appearance: textfield;
    }

    /* Remove setas no Chrome, Safari, Edge e Opera */
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      font-size: 16px;
      font-weight: 500;
      background: var(--primary);
      border: none;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      background: var(--primary-hover);
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.35);
    }

    .resultado {
      margin-top: 16px;
      background: #020617;
      color: var(--success);
      padding: 16px;
      font-size: 18px;
      text-align: center;
      border-radius: 8px;
      border: 1px solid var(--border-soft);
      min-height: 36px;
    }

    marquee {
      display: none;
    }

    .erro {
      color: var(--error);
      font-weight: 500;
      margin-top: 8px;
    }

    footer {
      margin-top: 48px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }
  </style>
</head>

<body>

  <h1>Calculadora Enterprise Premium Deluxe</h1>

  <div class="container">

    <!-- CALCULADORA -->
    <div class="box">

      <h2>Calculadora</h2>

      <!-- ERRO PROPOSITAL: INPUT COMO TEXTO -->
      <input type="number" id="num1" placeholder="Digite qualquer coisa">

      <!-- ERRO PROPOSITAL: SEM VALIDAÇÃO -->
      <input type="number" id="num2" placeholder="Outro valor aleatório">

      <button onclick="somar()">Somar</button>
      <button onclick="subtrair()">Subtrair</button>
      <button onclick="multiplicar()">Multiplicar</button>
      <button onclick="dividir()">Dividir</button>

      <div class="resultado" id="resultado"></div>

    </div>

    <!-- FORMULÁRIO -->
    <div class="box">

      <h2>Cadastro Super Seguro</h2>

      <!-- Tudo propositalmente errado -->

      <input type="text" id="nome" placeholder="Nome completo ou apelido">

      <!-- ERRO: email sem validação -->
      <input type="text" id="email" placeholder="Email">

      <!-- ERRO: telefone sem limite -->
      <input type="text" id="telefone" placeholder="Telefone">

      <!-- ERRO: senha visível -->
      <input type="text" id="senha" placeholder="Senha">

      <!-- ERRO: senha confirmação sem comparação -->
      <input type="text" id="confirmarSenha" placeholder="Confirmar senha">

      <!-- ERRO: idade texto -->
      <input type="text" id="idade" placeholder="Idade">

      <!-- ERRO: aceita qualquer coisa -->
      <input type="text" id="cpf" placeholder="CPF">

      <button onclick="cadastrar()">
        FINALIZAR CADASTRO DEFINITIVO
      </button>

      <p class="erro">
        Seus dados talvez estejam seguros.
      </p>

    </div>

  </div>

  <footer>
    Sistema desenvolvido sem nenhum padrão de qualidade.
  </footer>

  <script>

    function pegarNumero1() {
      return Number(document.getElementById("num1").value);
    }

    function pegarNumero2() {
      return Number(document.getElementById("num2").value);
    }

    /*Rogerio A.Blank solicitou remoção da funcionalidade inutil
    function preencherInputsErrados() {
      document.getElementById("num1").value = 212;
      document.getElementById("num2").value = 212;
    }*/

    function somar() {

      let n1 = pegarNumero1();
      let n2 = pegarNumero2();

      let resultado = n1 + n2;

      /* Informação deixa a calculadora irritante!
      alert("Você acabou de realizar a SOMA. O resultado está logo abaixo. Obrigado por usar esta calculadora extremamente moderna.");*/

      document.getElementById("resultado").innerHTML = resultado;

      preencherInputsErrados();
    }

    function subtrair() {

      let n1 = pegarNumero1();
      let n2 = pegarNumero2();

      let resultado = n1 - n2;

      /* Informação deixa a calculadora irritante!
      alert("Você acabou de realizar a SUBTRAÇÃO. O resultado está na linha abaixo. Isso era realmente necessário?");*/

      document.getElementById("resultado").innerHTML = resultado;

      preencherInputsErrados();
    }

    function multiplicar() {

      let n1 = pegarNumero1();
      let n2 = pegarNumero2();

      let resultado = n1 * n2;


      /* Informação deixa a calculadora irritante!
      alert("Parabéns. Você multiplicou dois números com sucesso absoluto.");*/

      document.getElementById("resultado").innerHTML = resultado;

      preencherInputsErrados();
    }

    function dividir() {

      let n1 = pegarNumero1();
      let n2 = pegarNumero2();

      let resultado = n1 / n2;

      /* Informação deixa a calculadora irritante!
      alert("Você realizou uma divisão. O resultado provavelmente está correto.");*/

      document.getElementById("resultado").innerHTML = resultado;

      preencherInputsErrados();
    }

    function cadastrar() {

      let nome = document.getElementById("nome").value;
      let email = document.getElementById("email").value;
      let telefone = document.getElementById("telefone").value;
      let senha = document.getElementById("senha").value;
      let confirmarSenha = document.getElementById("confirmarSenha").value;
      let idade = document.getElementById("idade").value;
      let cpf = document.getElementById("cpf").value;



      alert(
        "Cadastro realizado com sucesso extremamente questionável.\n\n" +
        "Nome: " + nome + "\n" +
        "Email: " + email + "\n" +
        "Telefone: " + telefone + "\n" +
        "Senha salva em texto puro no pensamento da aplicação."
      );

      console.log("DADOS DO USUÁRIO:");
      console.log(nome);
      console.log(email);
      console.log(telefone);
      console.log(senha);
      console.log(confirmarSenha);
      console.log(idade);
      console.log(cpf);


      document.getElementById("nome").value = "";
      document.getElementById("email").value = "";
      document.getElementById("telefone").value = "";
      document.getElementById("senha").value = "";
      document.getElementById("confirmarSenha").value = "";
      document.getElementById("idade").value = "";
      document.getElementById("cpf").value = "";

    }

    /*Desabilitado a pedido do Rogerio A.Blank
       setInterval(function() {
         alert("⚠ Lembrete importante: o sistema continua funcionando.");
       }, 15000);*/


    /* Informação desnecessária
    setInterval(function () {
      document.title = "⚠ SISTEMA INSTÁVEL ⚠";
    }, 3000);*/


    console.log("Sistema iniciado em modo duvidoso.");


    let banana = 999999;

  </script>

</body>

</html>
