<!DOCTYPE html>
<html>

<head>
    <title>Subir Degraus</title>
    <script>

        function Feitico() {

            let degraus = 5;
            let contador = 1;

            while (contador <= degraus) {
                texto = "Subindo degrau " + contador;
                document.getElementById("resultado").innerHTML = texto;
                console.log(texto);
                contador++;
            }
        }

    </script>
</head>

<body>
    <div id="resultado"> </div>
    <br>
    <button id="meuBotao" onclick="Feitico()"> Clique para Subir Degraus! </button>
</body>

</html>
