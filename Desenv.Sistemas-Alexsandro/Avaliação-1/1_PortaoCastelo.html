<!DOCTYPE html>
<html>

<head>
  <title>PortaoCastelo</title>
  <script>

    function validarIdade() {
        const idade = document.getElementById("idade").value;

        if (idade >= 18){
            document.getElementById("resultado").innerHTML =
            "Acesso Liberado!";            
        } else {
            document.getElementById("resultado").innerHTML =
            "Acesso Negado! Volte quando você tiver 18 anos ou mais!";
        }

    }

  </script>
</head>

<body>
  <input id="idade" type="number" placeholder="Informe sua Idade"> 
  <div id="resultado"> </div>
  <br>
  <button id="meuBotao" onclick="validarIdade()"> Validar entrada! </button>
</body>

</html>
